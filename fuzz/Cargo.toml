[package]
name = "yashy-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# `cargo fuzz` looks for this to know it may drive the package.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
yashy-codegen = { path = "../crates/yashy-codegen" }
yashy-common = { path = "../crates/yashy-common" }
yashy-lexer = { path = "../crates/yashy-lexer" }
yashy-parser = { path = "../crates/yashy-parser" }
yashy-sema = { path = "../crates/yashy-sema" }

# Its own workspace root: the fuzz package needs a nightly compiler and
# `libfuzzer-sys`, and the main workspace must stay buildable on stable with no
# network. `cargo test --workspace` therefore never builds this.
[workspace]

[[bin]]
name = "lex_parse"
path = "fuzz_targets/lex_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false
