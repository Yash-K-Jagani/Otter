[package]
name = "yashy-runtime"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]

[build-dependencies]
cc = "1"

# `tests/threads.rs` compiles the C thread suite with the same compiler
# `build.rs` uses, so the test needs the compiler discovery the build script
# already relies on.
[dev-dependencies]
cc = "1"

# The print tests re-run this binary as a child process to capture stdout, so
# they need to own `main`.
[[test]]
name = "print"
harness = false
