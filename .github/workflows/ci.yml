name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The driver compiles and links with `clang`; `llc` is only a fallback
      # for `check` and `--emit-ir`. Ubuntu runners do not guarantee either on
      # PATH. Installing `llvm` as well as `clang` is deliberate: it puts `llc`
      # on PATH, which is exactly the machine shape where detection must not
      # hand a link line to `llc`.
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          clang --version
          command -v llc >/dev/null && llc --version | head -n 1 || true

      # The Windows image ships LLVM, but do not assume it: fail here with a
      # readable message rather than in the first end-to-end test.
      - name: Verify LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          clang --version

      # rustc finds the MSVC linker on its own (through vswhere), but clang's
      # driver looks for `link.exe` on PATH. The Windows runner does not load the
      # Visual Studio environment into a plain step, so without this every
      # `otter build` fails at the link while the Rust tests themselves link
      # fine. This is also why the failure shows up only in the suites that
      # compile an Otter program.
      - name: Load the MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace --no-fail-fast
