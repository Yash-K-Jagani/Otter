[workspace]
resolver = "2"
members = [
    "crates/yashy-common",
    "crates/yashy-lexer",
    "crates/yashy-parser",
    "crates/yashy-hir",
    "crates/yashy-verify",
    "crates/yashy-sema",
    "crates/yashy-codegen",
    "crates/yashy-driver",
    "crates/yashy-runtime",
    "crates/yashy-fmt",
    "crates/yashy-lsp",
    "crates/yashy-bench",
    "crates/yashy-cache",
]

# `fuzz` is intentionally not a member yet; it arrives with the fuzzing task.

[workspace.package]
version = "0.1.0"
edition = "2021"
